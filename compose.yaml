services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: roomreservation
      POSTGRES_USER: roomreservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: